    <style>
      :root {
        --title: #111827;
        --body: #5f6678;
        --muted: #8b92a6;
        --grey: #f4f5f8;
        --line: #dedfe6;
        --warm: #f9f7f3;
        --purple: #0c66e4;
        --purple-dark: #0a52b8;
        --brand: #0c66e4;
        --brand-dark: #0a52b8;
        --white: #ffffff;
        --shadow: 0 30px 90px rgba(17, 24, 39, 0.12);
      }

      /* Editorial serif headings -- Playfair Display carries the "premium"
         read on every page, paired with Plus Jakarta Sans for everything
         else. .h1-display is for each page's one big hero headline;
         .h2-display is for section headings. Both share the same face so
         the pairing reads as one deliberate system, not a one-off accent. */
      .h1-display, .h2-display {
        font-family: 'Playfair Display', serif;
        letter-spacing: -0.01em;
      }
      .h1-display { font-weight: 800; line-height: 1.05; }
      .h1-display em, .h2-display em { font-style: italic; color: var(--brand); }

      /* Section H2 spec: 3.75rem / font-weight 700 at desktop, scaled down
         responsively for smaller viewports. */
      .h2-display {
        font-weight: 700;
        font-size: 1.875rem;
        line-height: 1.2;
      }
      @media (min-width: 640px) { .h2-display { font-size: 2.25rem; } }
      @media (min-width: 768px) { .h2-display { font-size: 3rem; } }
      @media (min-width: 1024px) { .h2-display { font-size: 3.75rem; } }

      .btn-animation {
        transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .btn-animation:hover {
        transform: translateY(-2px);
      }
      .btn-animation:active {
        transform: translateY(0);
      }
      .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: #f4f5f8;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #dedfe6;
        border-radius: 999px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: #0c66e4;
      }
      .reveal {
        opacity: 0;
        transform: translateY(26px);
        transition: opacity 0.7s ease, transform 0.7s ease;
      }
      .reveal.in-view {
        opacity: 1;
        transform: translateY(0);
      }
      /* Staggered fade-in for feature cards */
      .feature-card {
        opacity: 0;
        transform: translateY(20px);
        transition: opacity 0.5s ease, transform 0.5s ease;
      }
      .feature-card.in-view {
        opacity: 1;
        transform: translateY(0);
      }
      /* Smooth section separator gradient */
      .section-glow {
        position: relative;
      }
      .section-glow::before {
        content: '';
        position: absolute;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 120px;
        height: 2px;
        background: #0c66e4;
        border-radius: 999px;
      }
      /* Smooth hover lift for cards */
      .hover-lift {
        transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s ease;
      }
      .hover-lift:hover {
        transform: translateY(-6px);
        box-shadow: 0 20px 60px rgba(17, 24, 39, 0.1);
      }
      /* Pulse glow for CTAs */
      @keyframes pulse-glow {
        0%, 100% { box-shadow: 0 0 0 0 rgba(111, 77, 255, 0.3); }
        50% { box-shadow: 0 0 0 8px rgba(111, 77, 255, 0); }
      }
      .cta-glow {
        animation: pulse-glow 3s ease-in-out infinite;
      }

      /* One invisible snap anchor per booth-flow step. Steps are only ~160px
         of scroll apart, so without these a single wheel gesture travels
         several steps at once; scroll-snap-stop: always makes each gesture
         come to rest on the next step instead. Positioned by app.js. */
      .flow-snap-anchor {
        position: absolute;
        left: 0;
        width: 1px;
        height: 1px;
        pointer-events: none;
        scroll-snap-align: start;
        scroll-snap-stop: always;
      }

      /* Numbered step navigator for the scroll-driven How It Works flow */
      /* Booth flow leaves on a blur like the other sections, but only over its
         final screenful -- see the exit-late mode in app.js. The filter sits
         on the sticky element itself rather than a wrapper: on an ancestor it
         would create a containing block and break position: sticky, whereas
         on the sticky element it is harmless. */
      #boothFlowSticky {
        filter: blur(calc(var(--exit, 0) * 14px));
        opacity: calc(1 - var(--exit, 0) * 0.85);
      }

      /* Plain dots, no numerals. The button itself is a 1.5rem hit target;
         the visible mark is the pseudo-element, which stretches into a short
         bar on the active step. */
      .flow-step-dot {
        width: 1.5rem;
        height: 1.5rem;
        padding: 0;
        border: 0;
        background: transparent;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }
      .flow-step-dot::before {
        content: '';
        display: block;
        width: 0.45rem;
        height: 0.45rem;
        border-radius: 999px;
        background: #dedfe6;
        transition: background-color 0.2s ease, width 0.2s ease;
      }
      .flow-step-dot:hover::before {
        background: #8b92a6;
      }
      .flow-step-dot.active::before {
        background: #0c66e4;
        width: 1.15rem;
      }

      /* Radius convention (codifying existing usage, not a new rule):
         rounded-full = pills/buttons/avatars, rounded-3xl = primary cards,
         rounded-2xl = media frames/secondary cards, rounded-xl = form
         inputs/small chips. */

      /* Solid brand-blue accent. Reserved for: the pricing "Best Value"
         badge, one hero highlight, small decorative blobs. Never apply to
         large surfaces -- the site stays white/navy/electric-blue, this is
         emphasis only. */
      .gradient-accent-text {
        color: #0c66e4;
      }
      .gradient-accent-bg {
        background: #0c66e4;
      }
      .gradient-accent-ring {
        background: #0c66e4;
        padding: 1.5px;
        border-radius: inherit;
      }

      /* Button system */
      .btn-primary {
        display: inline-flex; align-items: center; gap: 0.5rem;
        background: #111827; color: #fff;
        padding: 1rem 2rem; border-radius: 999px;
        font-weight: 800; font-size: 0.875rem; text-transform: uppercase; letter-spacing: 0.05em;
        box-shadow: 0 10px 30px rgba(17, 24, 39, 0.2);
        transition: background-color 0.2s ease;
      }
      .btn-primary:hover { background: #070c15; }
      .btn-secondary {
        display: inline-flex; align-items: center; gap: 0.5rem;
        background: #fff; color: #111827; border: 1px solid #dedfe6;
        padding: 1rem 2rem; border-radius: 999px;
        font-weight: 800; font-size: 0.875rem; text-transform: uppercase; letter-spacing: 0.05em;
        transition: background-color 0.2s ease;
      }
      .btn-secondary:hover { background: #f4f5f8; }
      .btn-ghost {
        display: inline-flex; align-items: center; gap: 0.375rem;
        color: #0c66e4; font-weight: 700; font-size: 0.875rem;
        transition: gap 0.2s ease;
      }
      .btn-ghost:hover { gap: 0.625rem; }

      /* Badge / pill label */
      .badge {
        display: inline-block;
        font-size: 0.75rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em;
        padding: 0.375rem 0.875rem; border-radius: 999px;
      }

      /* Card system -- shared base, color/surface set per usage */
      .card-feature, .card-product, .card-pricing, .card-testimonial, .card-faq {
        border-radius: 1.5rem;
        border: 1px solid #dedfe6;
      }
      .card-feature { padding: 2rem; }
      .card-product {
        overflow: hidden;
        box-shadow: 0 20px 60px rgba(17, 24, 39, 0.08);
      }
      .card-product img {
        transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .card-product:hover img {
        transform: scale(1.04);
      }
      .card-pricing { padding: 2rem; }
      .card-testimonial { padding: 1.5rem; background: #fff; }
      .card-faq {
        background: #fff;
        border-color: #dedfe6;
        border-radius: 1rem;
        overflow: hidden;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }
      .card-faq.is-open {
        border-color: #0c66e4;
        box-shadow: 0 8px 24px rgba(12, 102, 228, 0.1);
      }

      /* Full-bleed statement panel that "floods" open on scroll. The top
         edge starts as a shallow trapezoid -- angled shoulders at both
         corners -- and squares off into a full rectangle as the section
         crosses the viewport. app.js drives --flood from 0 to 1; the
         polygon below derives both the shoulder height and the corner
         inset from that single value, so there's one source of truth for
         the animation and CSS does the interpolation. */
      .flood-panel {
        --flood: 0;
        clip-path: polygon(
          0% calc((1 - var(--flood)) * 80px),
          calc((1 - var(--flood)) * 4%) 0%,
          calc(100% - (1 - var(--flood)) * 4%) 0%,
          100% calc((1 - var(--flood)) * 80px),
          100% 100%,
          0% 100%
        );
      }
      /* The headline tracks the same progress a beat behind the panel, so
         the copy lands after the colour has actually arrived under it. */
      .flood-copy {
        opacity: calc(var(--flood) * 1.6 - 0.3);
        transform: translateY(calc((1 - var(--flood)) * 24px));
      }

      /* Feature cards on a filled surface get an oversized soft circle
         bleeding out of the top-right corner -- decorative depth only,
         clipped by the card's own overflow. Children are lifted above it
         so the shape never sits over the text. */
      .card-accent {
        position: relative;
        overflow: hidden;
        /* Defined after .card-feature so this drops the shared light hairline
           border, which would read as a seam on a filled card. */
        border-color: transparent;
      }
      .card-accent > * {
        position: relative;
        z-index: 1;
      }
      .card-accent::after {
        content: '';
        position: absolute;
        right: -28%;
        top: -38%;
        width: 76%;
        aspect-ratio: 1;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.07);
        pointer-events: none;
      }

      /* ---- Full-screen section rhythm -------------------------------- */

      /* Each major section fills the viewport and the next one rides up over
         it. svh keeps mobile browser chrome from pushing the fold off-screen.
         Sections are snap points, so a scroll gesture settles on a section
         rather than running past it; scroll-snap-stop stops a fast fling from
         skipping one entirely. Sections taller than the viewport (How It
         Works, FAQ) are handled by the spec's larger-than-snapport rule --
         they only snap at their edges, so their interiors scroll freely. */
      /* Scoped with :has so only pages that actually have full-screen
         sections become snap containers -- this stylesheet is shared by
         every page. */
      html:has(.fs) {
        scroll-snap-type: y mandatory;
      }
      .fs, .fs-block, .fs-compact {
        scroll-snap-align: start;
        scroll-snap-stop: always;
      }
      /* Snap target sized to its own content rather than forced to a full
         viewport -- lets shorter sections join the sequence without adding a
         whole screen of scrolling each. */
      .fs-compact {
        position: relative;
      }

      /* Product tour: only the selected panel is shown. Panels stay in the DOM
         so their screenshots are already decoded when a tab is picked. */
      .tour-panel[hidden] { display: none; }
      .tour-tab {
        border-left: 2px solid var(--line);
        transition: border-color 0.2s ease, background-color 0.2s ease;
      }
      .tour-tab[aria-selected="true"] {
        border-left-color: #0c66e4;
        background: var(--grey);
      }
      @media (max-width: 1023px) {
        .tour-tab {
          border-left: 0;
          border-bottom: 2px solid var(--line);
        }
        .tour-tab[aria-selected="true"] {
          border-left: 0;
          border-bottom-color: #0c66e4;
        }
      }
      /* The footer has to be a snap target too. Without it the last section's
         bottom edge is the final snap position, and scroll-snap-stop pins the
         page there -- leaving the footer permanently cut off. */
      footer {
        scroll-snap-align: end;
      }
      .fs {
        position: relative;
        min-height: 100vh;
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      /* Same height, normal block flow. For sections containing position:
         sticky children, which a flex parent can disturb. */
      .fs-block {
        position: relative;
        min-height: 100vh;
        min-height: 100svh;
      }
      /* The hero runs up behind the floating header instead of starting below
         it: the negative margin cancels main's 5rem top padding, and the
         matching padding keeps the content itself clear of the bar. */
      .fs-first {
        margin-top: -5rem;
        padding-top: 5rem;
        min-height: 100vh;
        min-height: 100svh;
      }
      .fs > .fs-body, .fs > .fs-body-soft { width: 100%; }

      /* Exit treatment as a section scrolls away: app.js publishes --exit. */
      .fs-body {
        filter: blur(calc(var(--exit) * 14px));
        opacity: calc(1 - var(--exit) * 0.85);
        transform: scale(calc(1 - var(--exit) * 0.04));
      }
      /* Opacity-only variant. filter and transform both create a containing
         block that breaks position: sticky descendants; plain opacity does
         not, so scroll-driven sections use this instead. */
      .fs-body-soft {
        opacity: calc(1 - var(--exit) * 0.85);
      }

      /* Pulls a section up over the one before it. Square edges and no
         shadow by design -- the rounded top is reserved for the footer. */
      .fs-lift {
        margin-top: -2.75rem;
      }

      /* Closing CTA: a sticky panel one screen tall inside a taller section,
         so it stays pinned and scales down as the section scrolls past --
         receding toward the footer rather than sliding away. The extra height
         is what gives it somewhere to travel; a single-viewport section would
         be pinned between two snap points with no room for the effect. */
      .closing-panel {
        transform: scale(calc(1 - var(--exit) * 0.28));
        border-radius: calc(var(--exit) * 2.5rem);
        opacity: calc(1 - var(--exit) * 0.3);
        transform-origin: center center;
      }

      /* ---- Hero background ------------------------------------------- */

      /* Drifting soft light pools -- the studio-lighting read. */
      .ph-glow {
        position: absolute;
        border-radius: 999px;
        filter: blur(70px);
        animation: ph-glow-drift 20s ease-in-out infinite;
      }
      @keyframes ph-glow-drift {
        0%, 100% { transform: translate(0, 0) scale(1); }
        33%      { transform: translate(46px, -34px) scale(1.14); }
        66%      { transform: translate(-34px, 24px) scale(0.92); }
      }

      /* Real printed strips drifting up and back -- the product's own output.
         The artwork already carries its white border and transparent
         surround, so the element is just a positioned frame for it. */
      .ph-strip {
        position: absolute;
        animation: ph-strip-drift 15s ease-in-out infinite;
      }
      .ph-strip img {
        display: block;
        width: 100%;
        height: auto;
        filter: drop-shadow(0 18px 34px rgba(17, 24, 39, 0.16));
      }
      @keyframes ph-strip-drift {
        0%, 100% { transform: rotate(var(--r, 0deg)) translateY(0); }
        50%      { transform: rotate(var(--r, 0deg)) translateY(-22px); }
      }

      /* Slow shutter-style pulse on the ring accents. */
      .ph-ring {
        position: absolute;
        border-radius: 999px;
        border: 2px solid rgba(12, 102, 228, 0.18);
        animation: ph-ring-pulse 7s ease-out infinite;
      }
      @keyframes ph-ring-pulse {
        0%   { transform: scale(0.75); opacity: 0; }
        35%  { opacity: 0.9; }
        100% { transform: scale(1.5); opacity: 0; }
      }

      /* ---- Review marquee -------------------------------------------- */

      .marquee {
        overflow: hidden;
        -webkit-mask-image: linear-gradient(90deg, transparent, #000 7%, #000 93%, transparent);
        mask-image: linear-gradient(90deg, transparent, #000 7%, #000 93%, transparent);
      }
      .marquee-track {
        display: flex;
        gap: 1.5rem;
        width: max-content;
        animation: marquee-scroll 52s linear infinite;
      }
      /* Card width lives here rather than on a Tailwind utility: these cards
         are injected by app.js after the CDN's content scan, so an arbitrary
         value class like w-[22rem] would never be generated. */
      .marquee-track .review-card {
        width: 20rem;
        flex-shrink: 0;
      }
      @media (min-width: 640px) {
        .marquee-track .review-card { width: 22rem; }
      }
      /* The track holds the cards twice, so -50% lands exactly on the seam. */
      @keyframes marquee-scroll {
        from { transform: translateX(0); }
        to   { transform: translateX(-50%); }
      }
      .marquee:hover .marquee-track,
      .marquee:focus-within .marquee-track {
        animation-play-state: paused;
      }

      /* ---- Hero ----------------------------------------------------- */

      /* The hero blurs back and fades as the page scrolls, so the section
         below (which is pulled up over it) reads as sliding on top.
         --exit is published by app.js from scroll depth over the hero. */
      .hero-content {
        filter: blur(calc(var(--exit) * 14px));
        opacity: calc(1 - var(--exit) * 0.85);
        transform: scale(calc(1 - var(--exit) * 0.05));
      }
      .hero-decor {
        opacity: calc(1 - var(--exit) * 1.2);
      }

      /* Toggle-switch flourish set inline in the headline. Sized entirely
         in em so it tracks the heading's responsive font size. */
      .hero-toggle {
        display: inline-flex;
        align-items: center;
        vertical-align: -0.06em;
        width: 1.85em;
        height: 0.95em;
        padding: 0.1em;
        margin: 0 0.14em;
        border-radius: 999px;
        background: linear-gradient(115deg, #1d4ed8 0%, #0b1220 88%);
        box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.35);
      }
      .hero-toggle-knob {
        /* font-size first: the width/height em values resolve against it,
           so 0.5 x 1.5 lands the knob at 0.75em of the heading. */
        font-size: 0.5em;
        width: 1.5em;
        height: 1.5em;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        background: #fff;
        color: #111827;
        font-family: system-ui, sans-serif;
        font-weight: 400;
        line-height: 1;
      }

      /* Four-point sparkles scattered around the headline. */
      .hero-sparkle {
        position: absolute;
        background: #3d89ef;
        clip-path: polygon(50% 0%, 60% 40%, 100% 50%, 60% 60%, 50% 100%, 40% 60%, 0% 50%, 40% 40%);
        pointer-events: none;
      }

      /* Blue arch (left) and the pair of quarter-rounds (right). */
      .hero-arch {
        position: absolute;
        width: 9rem;
        height: 4.5rem;
        border: 2.2rem solid #0c66e4;
        border-bottom: none;
        border-radius: 9rem 9rem 0 0;
        pointer-events: none;
      }
      .hero-quarters {
        position: absolute;
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
        pointer-events: none;
      }
      .hero-quarters span {
        width: 3.4rem;
        height: 3.4rem;
        background: #a8c9fb;
      }
      .hero-quarters span:first-child { border-radius: 3.4rem 3.4rem 0 3.4rem; }
      .hero-quarters span:last-child  { border-radius: 0 3.4rem 3.4rem 3.4rem; }

      /* Floating abstract app-window cards with a badge and a cursor. */
      .hero-float {
        position: absolute;
        pointer-events: none;
      }
      .hero-float-card {
        width: 15rem;
        border-radius: 0.85rem;
        background: #fff;
        border: 1px solid var(--line);
        box-shadow: 0 18px 50px rgba(17, 24, 39, 0.1);
        padding: 0.65rem;
      }
      .hero-float-dots {
        display: flex;
        gap: 0.25rem;
        margin-bottom: 0.6rem;
      }
      .hero-float-dots span {
        width: 0.4rem;
        height: 0.4rem;
        border-radius: 999px;
      }
      .hero-float-dots span:nth-child(1) { background: #f87171; }
      .hero-float-dots span:nth-child(2) { background: #fbbf24; }
      .hero-float-dots span:nth-child(3) { background: #34d399; }
      .hero-float-body {
        display: flex;
        gap: 0.5rem;
      }
      .hero-float-body i {
        display: block;
        background: var(--grey);
        border-radius: 0.3rem;
      }
      .hero-float-rail {
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
        width: 3.2rem;
        flex-shrink: 0;
      }
      .hero-float-rail i { height: 0.5rem; }
      .hero-float-main {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.35rem;
        flex: 1;
      }
      .hero-float-main i:first-child { height: 2rem; }
      .hero-float-main i:nth-child(2) { height: 2rem; }
      .hero-float-main i:last-child { height: 1.6rem; grid-column: 1 / -1; }
      .hero-badge-chip {
        position: absolute;
        border-radius: 999px;
        color: #fff;
        font-size: 0.72rem;
        font-weight: 800;
        padding: 0.3rem 0.75rem;
        box-shadow: 0 6px 18px rgba(17, 24, 39, 0.18);
      }
      .hero-cursor {
        position: absolute;
        font-size: 0.9rem;
      }

      /* Scroll-linked scene: app.js publishes --enter (0..1) from the
         section's travel through the viewport, and the two halves ride it
         at different rates so the media leads and the copy follows. The
         opacity ramps deliberately over- and undershoot 0..1 -- opacity
         clamps on its own, which is what produces the lag without needing
         per-child delays. */
      .scroll-scene {
        --enter: 0;
      }
      .scene-media {
        opacity: calc(var(--enter) * 1.5 - 0.1);
        transform: translateY(calc((1 - var(--enter)) * 56px)) scale(calc(0.94 + var(--enter) * 0.06));
      }
      .scene-copy {
        opacity: calc(var(--enter) * 1.5 - 0.45);
        transform: translateY(calc((1 - var(--enter)) * 30px));
      }

      /* Footer social buttons. Neutral on the dark panel by default, taking
         each network's own colour on hover; Instagram carries its gradient
         at rest since a flat swatch cannot stand in for it. */
      .social-dot {
        width: 2.25rem;
        height: 2.25rem;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.1);
        color: #fff;
        font-size: 0.8125rem;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background-color 0.2s ease, transform 0.2s ease;
      }
      .social-dot:hover {
        background: var(--brand);
        transform: translateY(-2px);
      }
      .social-instagram {
        background: linear-gradient(45deg, #f09433, #dc2743 45%, #bc1888 70%, #8134af);
      }
      .social-instagram:hover {
        background: linear-gradient(45deg, #f09433, #dc2743 45%, #bc1888 70%, #8134af);
        filter: brightness(1.15);
      }

      /* The header is a floating pill: the header element itself is a
         transparent full-width positioning shell, .header-shell is the visible
         rounded bar inside it. Solid white at rest; past the scroll
         threshold set in app.js (~10px) it turns into a translucent glass
         panel and lifts slightly. */
      /* Slides the whole bar clear of the viewport while scrolling down.
         The extra 1.5rem covers the pill's top offset and its shadow so
         nothing peeks over the edge mid-transition. */
      .site-header {
        transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .site-header.header-hidden {
        transform: translateY(calc(-100% - 1.5rem));
      }
      .site-header.scrolled .header-shell {
        background-color: rgba(255, 255, 255, 0.78);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        box-shadow: 0 10px 34px rgba(17, 24, 39, 0.12);
      }

      @media (prefers-reduced-motion: reduce) {
        .reveal, .feature-card, .hover-lift, .btn-animation,
        .cta-glow, .btn-ghost, .card-product img {
          transition: none !important;
          animation: none !important;
        }
        .reveal, .feature-card {
          opacity: 1 !important;
          transform: none !important;
        }
        .card-product:hover img {
          transform: none !important;
        }
        /* Land the scroll-driven pieces in their finished state -- full-bleed
           rectangle, everything in place and visible -- rather than
           animating them. */
        .flood-panel {
          clip-path: none !important;
        }
        .flood-copy, .scene-media, .scene-copy, .hero-content, .hero-decor,
        .fs-body, .fs-body-soft, .closing-panel {
          opacity: 1 !important;
          transform: none !important;
        }
        .closing-panel {
          border-radius: 0 !important;
        }
        .hero-content, .fs-body, #boothFlowSticky {
          filter: none !important;
        }
        #boothFlowSticky {
          opacity: 1 !important;
        }
        /* Hold the background art and the review marquee still. The marquee
           keeps its overflow clip, so the cards past the first screenful stay
           reachable by scrolling the strip rather than by waiting for it. */
        .ph-glow, .ph-strip, .ph-ring {
          animation: none !important;
        }
        .marquee-track {
          animation: none !important;
        }
        .marquee {
          overflow-x: auto;
        }
      }
    </style>

  </head>
  <body class="bg-white text-[#5f6678] font-sans overflow-x-hidden custom-scrollbar" data-view="payment-guest-success">

    <main class="min-h-screen flex items-center justify-center px-6">
      <div class="max-w-md w-full mx-auto text-center space-y-5">
        <div class="relative w-20 h-20 mx-auto">
          <span class="absolute -top-1 left-2 w-1.5 h-1.5 rounded-full bg-yellow-400"></span>
          <span class="absolute top-3 -right-2 w-1.5 h-3 rounded-full bg-brand rotate-12"></span>
          <span class="absolute -bottom-1 right-3 w-1.5 h-1.5 rounded-full bg-green-400"></span>
          <div class="relative z-10 w-20 h-20 rounded-full bg-green-100 text-green-700 flex items-center justify-center text-3xl">
            <i class="fa-solid fa-circle-check"></i>
          </div>
        </div>
        <h1 class="h1-display text-title text-3xl sm:text-4xl">Payment Successful!</h1>
        <p class="text-body text-base">Your payment <span id="guestPaymentAmount"></span>has been received. Thank you!</p>

        <div id="guestPaymentReceiptDetails" class="hidden text-left divide-y divide-line border-t border-b border-line">
          <div class="flex items-center gap-3 py-3">
            <span class="w-9 h-9 rounded-lg bg-green-100 text-green-700 flex items-center justify-center text-sm shrink-0"><i class="fa-solid fa-file-invoice"></i></span>
            <div class="text-left min-w-0">
              <p class="text-[11px] uppercase font-bold text-muted tracking-wide">Transaction ID</p>
              <p class="text-sm font-bold text-title font-mono truncate" id="guestPaymentTxnId">—</p>
            </div>
          </div>
        </div>

        <p class="text-xs text-muted">You may now close this window.</p>
      </div>
      <script>
        // This is a bare page with no app.js/Supabase wiring by design (it's
        // opened directly by the desktop app's own checkout webview, not a
        // normal site visit) -- so any receipt details come only from
        // whatever the redirect URL itself includes, nothing is fabricated.
        (function () {
          var params = new URLSearchParams(window.location.search);
          var amount = params.get("amount");
          var txnId = params.get("session_id") || params.get("transaction_id") || params.get("ref");
          if (amount) {
            document.getElementById("guestPaymentAmount").textContent = "of " + amount + " ";
          }
          if (txnId) {
            document.getElementById("guestPaymentTxnId").textContent = txnId;
            document.getElementById("guestPaymentReceiptDetails").classList.remove("hidden");
          }
        })();
      </script>

    </main>
  </body>
</html>
