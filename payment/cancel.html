        ],
        theme: {

    <style>
      :root {
        --title: #111827;
        --body: #5f6678;
        --muted: #8b92a6;
        --grey: #f4f5f8;
        --line: #dedfe6;
        --warm: #f9f7f3;
        --purple: #0c66e4;
        --purple-dark: #0a52b8;
        --brand: #0c66e4;
        --brand-dark: #0a52b8;
        --white: #ffffff;
        --shadow: 0 30px 90px rgba(17, 24, 39, 0.12);
      }

      /* Editorial serif headings -- Playfair Display carries the "premium"
         read on every page, paired with Plus Jakarta Sans for everything
         else. .h1-display is for each page's one big hero headline;
         .h2-display is for section headings. Both share the same face so
         the pairing reads as one deliberate system, not a one-off accent. */
      .h1-display, .h2-display {
        font-family: 'Playfair Display', serif;
        letter-spacing: -0.01em;
      }
      .h1-display { font-weight: 800; line-height: 1.05; }
      .h1-display em, .h2-display em { font-style: italic; color: var(--brand); }

      /* Section H2 spec: 3.75rem / font-weight 700 at desktop, scaled down
         responsively for smaller viewports. */
      .h2-display {
        font-weight: 700;
        font-size: 1.875rem;
        line-height: 1.2;
      }
      @media (min-width: 640px) { .h2-display { font-size: 2.25rem; } }
      @media (min-width: 768px) { .h2-display { font-size: 3rem; } }
      @media (min-width: 1024px) { .h2-display { font-size: 3.75rem; } }

      .btn-animation {
        transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .btn-animation:hover {
        transform: translateY(-2px);
      }
      .btn-animation:active {
        transform: translateY(0);
      }
      .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: #f4f5f8;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #dedfe6;
        border-radius: 999px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: #0c66e4;
      }
      .reveal {
        opacity: 0;
        transform: translateY(26px);
        transition: opacity 0.7s ease, transform 0.7s ease;
      }
      .reveal.in-view {
        opacity: 1;
        transform: translateY(0);
      }
      /* Staggered fade-in for feature cards */
      .feature-card {
        opacity: 0;
        transform: translateY(20px);
        transition: opacity 0.5s ease, transform 0.5s ease;
      }
      .feature-card.in-view {
        opacity: 1;
        transform: translateY(0);
      }
      /* Smooth section separator gradient */
      .section-glow {
        position: relative;
      }
      .section-glow::before {
        content: '';
        position: absolute;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 120px;
        height: 2px;
        background: linear-gradient(90deg, transparent, #0c66e4, transparent);
        border-radius: 999px;
      }
      /* Smooth hover lift for cards */
      .hover-lift {
        transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s ease;
      }
      .hover-lift:hover {
        transform: translateY(-6px);
        box-shadow: 0 20px 60px rgba(17, 24, 39, 0.1);
      }
      /* Pulse glow for CTAs */
      @keyframes pulse-glow {
        0%, 100% { box-shadow: 0 0 0 0 rgba(111, 77, 255, 0.3); }
        50% { box-shadow: 0 0 0 8px rgba(111, 77, 255, 0); }
      }
      .cta-glow {
        animation: pulse-glow 3s ease-in-out infinite;
      }

      /* Animated flow connector -- traveling pulse between hardware-flow steps */
      .flow-connector {
        position: relative;
        width: 2rem;
        height: 2px;
        background: #dedfe6;
        border-radius: 999px;
        overflow: visible;
      }
      .flow-dot {
        position: absolute;
        top: 50%;
        left: 0;
        width: 8px;
        height: 8px;
        margin-top: -4px;
        border-radius: 999px;
        background: #0c66e4;
        box-shadow: 0 0 8px rgba(12, 102, 228, 0.7);
        animation: flow-travel 3.2s ease-in-out infinite;
      }
      @keyframes flow-travel {
        0% { left: 0; opacity: 0; }
        10% { opacity: 1; }
        90% { opacity: 1; }
        100% { left: calc(100% - 8px); opacity: 0; }
      }

      /* Numbered step navigator for the scroll-driven How It Works flow */
      .flow-step-dot {
        width: 2rem;
        height: 2rem;
        border-radius: 999px;
        border: 1px solid #dedfe6;
        background: #fff;
        color: #5f6678;
        font-size: 0.75rem;
        font-weight: 800;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s ease;
        cursor: pointer;
      }
      .flow-step-dot:hover {
        border-color: #0c66e4;
        color: #0c66e4;
      }
      .flow-step-dot.active {
        background: #0c66e4;
        color: #fff;
        border-color: #0c66e4;
        transform: scale(1.15);
      }

      /* Hardware flow icon row -- highlights whichever step's full detail
         panel is currently shown below it */
      .flow-icon .w-14 {
        transition: background-color 0.2s ease, color 0.2s ease;
      }
      .flow-icon.is-active .w-14 {
        background: #0c66e4;
        color: #fff;
      }
      .flow-icon p {
        border-bottom: 1px dashed #dedfe6;
      }

      /* Radius convention (codifying existing usage, not a new rule):
         rounded-full = pills/buttons/avatars, rounded-3xl = primary cards,
         rounded-2xl = media frames/secondary cards, rounded-xl = form
         inputs/small chips. */

      /* Sparing violet-gradient accent. Reserved for: the pricing "Best
         Value" badge, one hero highlight, small decorative blobs. Never
         apply to large surfaces -- the site stays white/navy/electric-blue,
         this is emphasis only. */
      .gradient-accent-text {
        background: linear-gradient(135deg, #0c66e4 0%, #7c3aed 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .gradient-accent-bg {
        background: linear-gradient(135deg, #0c66e4 0%, #7c3aed 100%);
      }
      .gradient-accent-ring {
        background: linear-gradient(135deg, #0c66e4 0%, #7c3aed 100%);
        padding: 1.5px;
        border-radius: inherit;
      }

      /* Button system */
      .btn-primary {
        display: inline-flex; align-items: center; gap: 0.5rem;
        background: #111827; color: #fff;
        padding: 1rem 2rem; border-radius: 999px;
        font-weight: 800; font-size: 0.875rem; text-transform: uppercase; letter-spacing: 0.05em;
        box-shadow: 0 10px 30px rgba(17, 24, 39, 0.2);
        transition: background-color 0.2s ease;
      }
      .btn-primary:hover { background: #070c15; }
      .btn-secondary {
        display: inline-flex; align-items: center; gap: 0.5rem;
        background: #fff; color: #111827; border: 1px solid #dedfe6;
        padding: 1rem 2rem; border-radius: 999px;
        font-weight: 800; font-size: 0.875rem; text-transform: uppercase; letter-spacing: 0.05em;
        transition: background-color 0.2s ease;
      }
      .btn-secondary:hover { background: #f4f5f8; }
      .btn-ghost {
        display: inline-flex; align-items: center; gap: 0.375rem;
        color: #0c66e4; font-weight: 700; font-size: 0.875rem;
        transition: gap 0.2s ease;
      }
      .btn-ghost:hover { gap: 0.625rem; }

      /* Badge / pill label */
      .badge {
        display: inline-block;
        font-size: 0.75rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em;
        padding: 0.375rem 0.875rem; border-radius: 999px;
      }

      /* Card system -- shared base, color/surface set per usage */
      .card-feature, .card-product, .card-pricing, .card-testimonial, .card-faq {
        border-radius: 1.5rem;
        border: 1px solid #dedfe6;
      }
      .card-feature { padding: 2rem; }
      .card-product {
        overflow: hidden;
        box-shadow: 0 20px 60px rgba(17, 24, 39, 0.08);
      }
      .card-product img {
        transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .card-product:hover img {
        transform: scale(1.04);
      }
      .card-pricing { padding: 2rem; }
      .card-testimonial { padding: 1.5rem; background: #fff; }
      .card-faq {
        background: #fff;
        border-color: #dedfe6;
        border-radius: 1rem;
        overflow: hidden;
      }

      /* Header blur/shadow intensifies past the scroll threshold set in
         app.js (~10px), rather than introducing blur that wasn't there --
         the header is always translucent+blurred; this just strengthens it. */
      .site-header.scrolled {
        background-color: rgba(249, 247, 243, 0.97);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
      }

      @media (prefers-reduced-motion: reduce) {
        .reveal, .feature-card, .hover-lift, .btn-animation,
        .cta-glow, .btn-ghost, .card-product img, .flow-dot {
          transition: none !important;
          animation: none !important;
        }
        .flow-dot {
          display: none !important;
        }
        .reveal, .feature-card {
          opacity: 1 !important;
          transform: none !important;
        }
        .card-product:hover img {
          transform: none !important;
        }
      }
    </style>

  </head>
  <body class="bg-warm text-[#5f6678] font-sans overflow-x-hidden custom-scrollbar" data-view="payment-guest-cancel">

    <main class="min-h-screen flex items-center justify-center px-6">
      <div class="max-w-md w-full mx-auto text-center space-y-5">
        <div class="w-20 h-20 rounded-full bg-brand/10 text-brand flex items-center justify-center text-3xl mx-auto">
          <i class="fa-solid fa-circle-info"></i>
        </div>
        <h1 class="h1-display text-title text-3xl sm:text-4xl">Payment Cancelled</h1>
        <p class="text-body text-base">No charge was made. You may now close this window.</p>
      </div>

    </main>
  </body>
</html>
